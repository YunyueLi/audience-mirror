name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install -e '.[media,web,dev]'

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run zero-cost demo
        run: audience-mirror demo

      - name: Validate generated traces
        run: >-
          audience-mirror validate traces artifacts/public-demo/deep-traces.json
          --timeline artifacts/public-demo/timeline.json
